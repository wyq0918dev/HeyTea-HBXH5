<!DOCTYPE html>
<html lang="zh-CN">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1.0" />
	<title>喜茶·春日限定</title>
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
			font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
		}

		.page {
			width: 100vw;
			height: 100vh;
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			text-align: center;
			padding: 20px;
		}

		#page-welcome {
			background: linear-gradient(to bottom, #FDE0DC, #F9CBBD);
		}

		.logo {
			font-size: 28px;
			font-weight: bold;
			color: #C53030;
			margin-bottom: 16px;
		}

		.slogan {
			font-size: 18px;
			color: #5A2A27;
			max-width: 80%;
			line-height: 1.5;
		}

		.btn {
			padding: 12px 30px;
			background: #C53030;
			color: white;
			border: none;
			border-radius: 24px;
			font-size: 16px;
			cursor: pointer;
			margin-top: 20px;
		}

		/* 产品页面背景 */
		#page-product {
			background: #FFF9F9;
			/* 垂直滚动 */
			overflow-y: auto;
		}

		.product-title {
			font-size: 22px;
			color: #c53030;
			margin-bottom: 24px;
		}

		.product-item {
			background: white;
			padding: 16px;
			border-radius: 12px;
			margin: 12px 0;
			width: 100%;
			max-width: 320px;
			box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
		}

		.product-img {
			width: 100%;
			height: 200px;
			object-fit: cover;
			border-radius: 8px;
			margin-bottom: 10px;
		}

		.product-name {
			font-weight: bold;
			font-size: 18px;
			margin-bottom: 6px;
		}

		.product-desv {
			color: #666;
			font-size: 14px;
		}

		/* 互动页面 (后续完善) */
		#page-interact {
			background: #FFF9F9;
		}
	</style>
	<script>
		function goToPage(pageName) {
			document.querySelectorAll('.page').forEach(page => {
				page.style.display = 'none';
			});
			document.getElementById('page-' + pageName).style.display = 'flex';
		}
	</script>
</head>

<body>
	<!-- 欢迎页 -->
	<div id="page-welcome" , class="page">
		<div class="logo">
			HEYTEA 喜茶
		</div>
		<div class="slogan">
			春日限定·一口尝尽江南春
		</div>
		<button class="btn" onclick="goToPage('product')">
			立即探索
		</button>
	</div>
	<!-- 产品页 (增加图片) -->
	<div id="page-product" class="page">
		<div class="product-title">🌿春日新品上市</div>
		<div class="product-item">
			<img src="./img/青团波波.png" alt="青团波波" class="product-img">
			<div class="product-name">青团波波</div>
			<div class="product-desv">艾草清香 x 软糯麻薯</div>
		</div>
		<div class="product-item">
			<img src="./img/樱花轻乳.png" alt="樱花轻乳" class="product-img">
			<div class="product-name">樱花轻乳</div>
			<div class="product-desv">春日樱花 x 云顶轻乳</div>
		</div>
		<div class="product-item">
			<img src="./img/龙井拿铁.png" alt="龙井拿铁" class="product-img">
			<div class="product-name">龙井拿铁</div>
			<div class="product-desv">明前龙井 x 醇厚拿铁</div>
		</div>
		<button class="btn" onclick="goToPage('interact')">
			喜欢就互动吧
		</button>
	</div>
	<!-- 互动页面 -->
	<div id="page-interact" class="page">
		[互动内容 - 后续开发]
	</div>
	<!-- 默认显示欢迎页 -->
	<script>
		goToPage('welcome');
	</script>
</body>

</html>
