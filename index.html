<!DOCTYPE html>
<html lang="zh-CN">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1.0" />
	<title>喜茶·春日限定</title>
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
			font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
		}

		.page {
			width: 100vw;
			height: 100vh;
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			text-align: center;
			padding: 20px;
		}

		#page-welcome {
			background: linear-gradient(to bottom, #FDE0DC, #F9CBBD);
		}

		.logo {
			font-size: 28px;
			font-weight: bold;
			color: #C53030;
			margin-bottom: 16px;
		}

		.slogan {
			font-size: 18px;
			color: #5A2A27;
			max-width: 80%;
			line-height: 1.5;
		}

		.btn {
			padding: 12px 30px;
			background: #C53030;
			color: white;
			border: none;
			border-radius: 24px;
			font-size: 16px;
			cursor: pointer;
			margin-top: 20px;
		}

		/* 产品页面背景 */
		#page-product {
			background: #FFF9F9;
		}

		.product-title {
			font-size: 22px;
			color: #c53030;
			margin-bottom: 24px;
		}

		.product-item {
			background: white;
			padding: 16px;
			border-radius: 12px;
			margin: 12px 0;
			width: 100%;
			max-width: 320px;
			box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
		}

		.product-img {
			width: 100%;
			height: 200px;
			object-fit: cover;
			border-radius: 8px;
			margin-bottom: 10px;
		}

		.product-name {
			font-weight: bold;
			font-size: 18px;
			margin-bottom: 6px;
		}

		.product-desv {
			color: #666;
			font-size: 14px;
		}

		.carousel-container {
			width: 100%;
			max-width: 320px;
			position: relative;
		}

		.carousel-image {
			width: 100%;
			height: 320px;
			object-fit: cover;
			border-radius: 16px;
			background: #f0f0f0;
		}

		.carousel-nav {
			margin-top: 12px;
			display: flex;
			justify-content: center;
			gap: 12px;
		}

		.nav-btn {
			padding: 6px 12px;
			background: #f0f0f0;
			border: none;
			border-radius: 4px;
			font-size: 14px;
			cursor: pointer;
		}

		#product-desc-text {
			margin-top: 16px;
			font-size: 16px;
			color: #333;
			max-width: 320px;
		}

		/* 互动页面 (后续完善) */
		#page-interact {
			background: #FFF9F9;
		}
	</style>
	<script>
		function goToPage(pageName) {
			document.querySelectorAll('.page').forEach(page => {
				page.style.display = 'none';
			});
			document.getElementById('page-' + pageName).style.display = 'flex';
		}

		const products = [
			{
				img: "./img/青团波波.png",
				desc: "青团波波：艾草清香 x 软糯麻薯"
			},
			{
				img: "./img/樱花轻乳.png",
				desc: "樱花轻乳：春日樱花 x 云顶轻乳"
			},
			{
				img: "./img/龙井拿铁.png",
				desc: "龙井拿铁：明前龙井 x 醇厚拿铁"
			}
		];

		let currentProductIndex = 0;

		function updateCarousel() {
			const item = products[currentProductIndex];
			document.getElementById('carousel-image').src = item.img;
			document.getElementById('product-desc-text').innerText = item.desc;
			document.getElementById('product-index').innerText = `${currentProductIndex + 1} / ${products.length}`;
		}

		function switchProduct(direction) {
			currentProductIndex += direction;
			if (currentProductIndex < 0) {
				currentProductIndex = products.length - 1;
			} else if (currentProductIndex >= products.length) {
				currentProductIndex = 0;
			}
			updateCarousel();
		}
	</script>
</head>

<body>
	<!-- 欢迎页 -->
	<div id="page-welcome" , class="page">
		<div class="logo">
			HEYTEA 喜茶
		</div>
		<div class="slogan">
			春日限定·一口尝尽江南春
		</div>
		<button class="btn" onclick="goToPage('product')">
			立即探索
		</button>
	</div>
	<!-- 产品页 (轮播图) -->
	<div id="page-product" class="page">
		<div class="product-title">🌿春日新品上市</div>
		<div class="carousel-container">
			<img class="carousel-image" id="carousel-image" src="./img/青团波波.png" alt="新品饮品">
		</div>
		<div class="carousel-nav">
			<button class="nav-btn" onclick="switchProduct(-1)">&lt;</button>
			<span id="product-index">1 / 3</span>
			<button class="nav-btn" onclick="switchProduct(1)">&gt;</button>
		</div>
		<div id="product-desc-text">
			青团波波:艾草清香 x 软糯麻薯
		</div>
		<button class="btn" onclick="goToPage('interact')">
			喜欢就互动吧
		</button>
	</div>
	<!-- 互动页面 -->
	<div id="page-interact" class="page">
		[互动内容 - 后续开发]
	</div>
	<!-- 脚本 -->
	<script>
		// 默认显示欢迎页
		goToPage('welcome');
		updateCarousel();
	</script>
</body>

</html>
